# Complete wrapper for the existing humidity-control example.
esphome:
  name: broan-active-test
esp32:
  board: esp32dev
  framework:
    type: esp-idf
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
api:
ota:
  - platform: esphome
logger:
  baud_rate: 0
external_components:
  - source:
      type: git
      url: https://github.com/babgvant/broan_erv_uart
      ref: main
    components: [broan]

uart:
  id: rs485
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 38400
  rx_buffer_size: 2048
broan:
  uart_id: rs485
  id: mybroan
select:
  - platform: broan
    fan_mode: {name: Fan Mode}
number:
  - platform: broan
    fan_speed: {name: Fan Speed}
    humidity_setpoint: {name: Humidity Setpoint}
    intermittent_period: {name: Intermittent Period}
switch:
  - platform: broan
    humidity_control:
      name: Humidity Control
      id: humcontrol
      on_turn_on:
        then:
          lambda: id(mybroan).setCurrentHumidity(id(myhumidity).state);
sensor:
  - platform: broan
    power: {name: Power Draw}
    temperature: {name: Temperature}
    temperature_out: {name: Temperature2}
    filter_life: {name: Remaining Filter Life}
  - platform: homeassistant
    id: myhumidity
    name: Home Assistant Humidity
    internal: true
    entity_id: sensor.main_thermostat_current_humidity
    on_value:
      then:
        lambda: |-
          if (id(humcontrol).state) {
            id(mybroan).setCurrentHumidity(id(myhumidity).state);
          }
button:
  - platform: broan
    filter_reset: {name: Filter Reset}
