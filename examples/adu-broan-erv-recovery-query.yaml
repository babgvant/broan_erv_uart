packages:
  query_base: !include adu-broan-erv-uart-query.yaml

broan:
  query_recovery_mode: true

switch:
  - id: !extend broan_telemetry_polling
    restore_mode: ALWAYS_ON

sensor:
  - platform: broan
    bath_boost_remaining:
      name: Bath Boost Remaining
    turbo_remaining:
      name: Turbo Remaining
      disabled_by_default: true
  - platform: template
    name: Telemetry Last Successful Update Age
    entity_category: diagnostic
    device_class: duration
    unit_of_measurement: s
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return id(erv).get_last_probe_success_age();

button:
  - platform: template
    name: Start Five Query Trial
    entity_category: diagnostic
    on_press:
      - lambda: id(erv).start_probe_trial();
  - platform: template
    name: Stop Telemetry Trial
    entity_category: diagnostic
    on_press:
      - lambda: id(erv).stop_probe_polling();
